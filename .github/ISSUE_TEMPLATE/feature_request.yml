name: Feature request
description: Suggest an improvement to an existing DevToolkit workflow
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What developer problem or friction are you experiencing?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Existing tool workflow
        - Queue / bulk processing
        - Results / downloads
        - Dashboard / discovery
        - Accessibility / UX
        - Server / deployment
        - Documentation
        - Testing / developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. What workarounds or other approaches have you tried?
  - type: textarea
    id: value
    attributes:
      label: Who benefits?
      description: Explain who would use this and why it matters.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This request improves DevToolkit rather than turning one tool into a separate application.
          required: true
