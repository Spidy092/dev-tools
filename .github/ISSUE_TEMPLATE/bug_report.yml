name: Bug report
description: Report a reproducible problem in DevToolkit
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include secrets or private files. Security vulnerabilities should be reported using SECURITY.md instead of a public issue.
  - type: dropdown
    id: tool
    attributes:
      label: Affected tool or area
      options:
        - PHP Protector
        - Image Resizer
        - Image Converter
        - Image Compressor
        - PDF Compressor
        - Smart File Renamer
        - Code Minifier
        - Dashboard / navigation
        - Upload / queue / results
        - Deployment / server
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Configure ...
        4. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DevToolkit version / commit
      placeholder: e.g. main, v1.0.0, or commit SHA
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g. 20.18.0
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04, Windows 11, macOS 15
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets, tokens, private paths, and sensitive file contents.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This is not a security vulnerability that should be reported privately.
          required: true
